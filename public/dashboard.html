<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — CHM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--card:#1a1d27;--card2:#1f2333;--border:#2a2d3e;--text:#e8eaf0;--muted:#7a7f96;
  --blue:#4a8fe8;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444;
  --green-bg:rgba(34,197,94,.1);--red-bg:rgba(239,68,68,.1);--blue-bg:rgba(74,143,232,.1);}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.pin-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:999}
.pin-screen.hidden{display:none}
.pin-dots{display:flex;gap:16px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .15s}
.pin-dot.filled{background:var(--blue);border-color:var(--blue)}
.pin-dot.error{background:var(--red);border-color:var(--red)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.pin-key{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:22px;font-weight:500;cursor:pointer;text-align:center;font-family:'DM Mono',monospace;color:var(--text)}
.pin-key:active{transform:scale(.93)}
.pin-error{font-size:13px;color:var(--red);min-height:20px}
.main{display:none}
.main.visible{display:block}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.h-left{display:flex;align-items:center;gap:12px}
.h-title h1{font-size:17px;font-weight:600}
.h-title p{font-size:12px;color:var(--muted)}
.h-right{display:flex;align-items:center;gap:14px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ts{font-size:11px;color:var(--muted)}
.btn-reset{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.btn-reset:hover{border-color:var(--red);color:var(--red)}
.btn-reports{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn-reports:hover{border-color:var(--blue);color:var(--blue)}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 24px 0}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.kpi-val{font-size:28px;font-weight:600;font-family:'DM Mono',monospace}
.kpi-lbl{font-size:11px;color:var(--muted);margin-top:3px}
.kpi.g .kpi-val{color:var(--green)}
.kpi.r .kpi-val{color:var(--red)}
.kpi.b .kpi-val{color:var(--blue)}
.kpi.y .kpi-val{color:var(--yellow)}
.gprog{margin:16px 24px 0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.gprog-hdr{display:flex;justify-content:space-between;margin-bottom:10px}
.gprog-pct{font-size:24px;font-weight:600;font-family:'DM Mono',monospace;color:var(--green)}
.pbar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;display:flex}
.pseg{height:100%;transition:width .4s}
.tours-wrap{padding:16px 24px 80px}
.sec-lbl{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.tours-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.tc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tc:hover{border-color:var(--blue)}
.tc-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border)}
.tc-id{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;color:var(--blue)}
.tc-status{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.tc-status.done{background:var(--green-bg);color:var(--green)}
.tc-status.prog{background:rgba(245,158,11,.1);color:var(--yellow)}
.tc-status.idle{background:var(--border);color:var(--muted)}
.tc-status.bloc{background:var(--red-bg);color:var(--red)}
.tc-body{padding:11px 14px}
.tc-field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tc-label{font-size:12px;color:var(--muted);width:16px;flex-shrink:0}
.tc-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;padding:3px 0;font-family:inherit;outline:none}
.tc-input:focus{border-color:var(--blue)}
.tc-input::placeholder{color:var(--muted)}
.tc-input.rempl{border-bottom-style:dashed;color:var(--yellow)}
.tc-input.rempl::placeholder{color:var(--muted)}
.tc-times{display:flex;gap:8px;margin-bottom:10px}
.tc-time{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:4px 8px;font-family:'DM Mono',monospace;outline:none}
.tc-time:focus{border-color:var(--blue)}
.tpbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;display:flex;margin-bottom:8px}
.tc-counts{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.tc-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;border-top:1px solid var(--border);background:var(--card2)}
.tc-last{font-size:10px;color:var(--muted)}
.tc-inc{font-size:11px;color:var(--red);background:var(--red-bg);padding:2px 8px;border-radius:10px;cursor:pointer;display:none}
.saved{font-size:10px;color:var(--green);opacity:0;transition:opacity .3s;margin-left:6px}
.saved.show{opacity:1}
@media(max-width:768px){.kpi-strip{grid-template-columns:1fr 1fr}.tours-wrap{padding-left:16px;padding-right:16px}.kpi-strip,.gprog{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>

<div class="pin-screen" id="pin-screen">
  <div style="font-size:52px">📊</div>
  <div style="font-size:22px;font-weight:600">Tableau de bord</div>
  <div style="font-size:14px;color:var(--muted)">Accès encadrant</div>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
    <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    <div class="pin-dot" id="pd4"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-grid">
    <button class="pin-key" onclick="pinKey('1')">1</button><button class="pin-key" onclick="pinKey('2')">2</button><button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button><button class="pin-key" onclick="pinKey('5')">5</button><button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button><button class="pin-key" onclick="pinKey('8')">8</button><button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key" style="font-size:16px;color:var(--muted)" onclick="pinKey('del')">⌫</button>
    <button class="pin-key" onclick="pinKey('0')">0</button>
    <button class="pin-key" style="font-size:16px;color:var(--muted)" onclick="pinKey('clear')">✕</button>
  </div>
</div>

<div class="main" id="main">
  <header>
    <div class="h-left">
      <span style="font-size:28px">📬</span>
      <div class="h-title"><h1>CHM Distribution</h1><p>Tableau de bord encadrant</p></div>
    </div>
    <div class="h-right">
      <div class="live"><div class="live-dot"></div>Temps réel</div>
      <div class="ts" id="ts">—</div>
      <a class="btn-reports" href="/reports">📈 Rapports</a>
      <button class="btn-reset" onclick="confirmReset()">🔄 Réinitialiser</button>
    </div>
  </header>

  <div class="kpi-strip">
    <div class="kpi g"><span style="font-size:28px">✅</span><div><div class="kpi-val" id="k-g">0</div><div class="kpi-lbl">Livrés</div></div></div>
    <div class="kpi r"><span style="font-size:28px">🔒</span><div><div class="kpi-val" id="k-a">0</div><div class="kpi-lbl">Pas d'accès</div></div></div>
    <div class="kpi b"><span style="font-size:28px">🚫</span><div><div class="kpi-val" id="k-s">0</div><div class="kpi-lbl">Stop pub</div></div></div>
    <div class="kpi y"><span style="font-size:28px">⚠️</span><div><div class="kpi-val" id="k-i">0</div><div class="kpi-lbl">Incidents</div></div></div>
  </div>

  <div class="gprog">
    <div class="gprog-hdr">
      <span style="font-size:13px;font-weight:500">Progression globale — 22 tournées</span>
      <span class="gprog-pct" id="g-pct">0%</span>
    </div>
    <div class="pbar">
      <div class="pseg" id="pb-g" style="width:0%;background:var(--green)"></div>
      <div class="pseg" id="pb-r" style="width:0%;background:var(--red)"></div>
    </div>
    <div style="display:flex;gap:20px;margin-top:10px;font-size:12px;color:var(--muted)">
      <span>● Livrés</span><span style="color:var(--red)">● Incidents</span><span>○ Non faits</span>
    </div>
  </div>

  <div class="tours-wrap">
    <div class="sec-lbl">Toutes les tournées</div>
    <div class="tours-grid" id="tours-grid"></div>
  </div>
</div>

<script>
const TOUR_META = {"CHM_1111":{"total":226,"seqs":20},"CHM_0707":{"total":497,"seqs":40},"CHM_0404":{"total":418,"seqs":40},"CHM_0202":{"total":358,"seqs":28},"CHM_6003":{"total":335,"seqs":28},"CHM_6002":{"total":344,"seqs":28},"CHM_6001":{"total":211,"seqs":19},"CHM_4007":{"total":349,"seqs":28},"CHM_4006":{"total":345,"seqs":28},"CHM_4005":{"total":354,"seqs":28},"CHM_4003":{"total":333,"seqs":28},"CHM_3030":{"total":487,"seqs":40},"CHM_2929":{"total":446,"seqs":39},"CHM_2727":{"total":283,"seqs":26},"CHM_2626":{"total":460,"seqs":40},"CHM_2323":{"total":420,"seqs":35},"CHM_1919":{"total":500,"seqs":40},"CHM_1616":{"total":493,"seqs":40},"CHM_1414":{"total":254,"seqs":20},"CHM_1313":{"total":346,"seqs":27},"CHM_1212":{"total":243,"seqs":28},"CHM_4004":{"total":214,"seqs":19}};
const TOUR_IDS  = ["CHM_0202", "CHM_0404", "CHM_0707", "CHM_1111", "CHM_1212", "CHM_1313", "CHM_1414", "CHM_1616", "CHM_1919", "CHM_2323", "CHM_2626", "CHM_2727", "CHM_2929", "CHM_3030", "CHM_4003", "CHM_4004", "CHM_4005", "CHM_4006", "CHM_4007", "CHM_6001", "CHM_6002", "CHM_6003"];
let data = {stats:{},lastUpdate:{},assignments:{},incidents:{}};
let saveTimers = {};

function simplehash(s){let h=0;for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return Math.abs(h).toString(16).padStart(8,'0');}
const PIN_CHECK=simplehash('13600');
let pinBuf='';

function pinKey(k){
  document.getElementById('pin-error').textContent='';
  document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('error'));
  if(k==='del') pinBuf=pinBuf.slice(0,-1);
  else if(k==='clear') pinBuf='';
  else if(pinBuf.length<5) pinBuf+=k;
  for(let i=0;i<5;i++) document.getElementById('pd'+i)?.classList.toggle('filled',i<pinBuf.length);
  if(pinBuf.length===5){
    if(simplehash(pinBuf)===PIN_CHECK){
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('main').classList.add('visible');
      init();
    } else {
      document.querySelectorAll('.pin-dot').forEach(d=>d.classList.add('error'));
      document.getElementById('pin-error').textContent='Code incorrect';
      setTimeout(()=>{pinBuf='';for(let i=0;i<5;i++){document.getElementById('pd'+i)?.classList.remove('filled','error');}document.getElementById('pin-error').textContent='';},800);
    }
  }
}

function init(){
  buildGrid();
  connectSSE();
}

function connectSSE(){
  const es=new EventSource('/api/stream');
  es.onmessage=e=>{try{apply(JSON.parse(e.data));}catch(err){}};
  es.onerror=()=>{es.close();setTimeout(connectSSE,3000);};
}

function apply(payload){
  data=payload;
  renderKPIs();
  renderGlobalProg();
  updateCards();
  const ts=new Date(payload.ts);
  document.getElementById('ts').textContent='Màj '+ts.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function renderKPIs(){
  let g=0,a=0,s=0,inc=0;
  TOUR_IDS.forEach(tid=>{
    const st=data.stats[tid]||{};
    g+=(st[2]||0); a+=(st.acces||0); s+=(st.stoppub||0);
    inc+=(data.incidents[tid]||0);
  });
  document.getElementById('k-g').textContent=g;
  document.getElementById('k-a').textContent=a;
  document.getElementById('k-s').textContent=s;
  document.getElementById('k-i').textContent=inc;
}

function renderGlobalProg(){
  let g=0,r=0,total=0;
  TOUR_IDS.forEach(tid=>{
    const st=data.stats[tid]||{};
    const t=TOUR_META[tid]?.total||0;
    total+=t; g+=(st[2]||0); r+=(st[3]||0);
  });
  const pct=total>0?Math.round(g/total*100):0;
  document.getElementById('g-pct').textContent=pct+'%';
  document.getElementById('pb-g').style.width=(g/total*100)+'%';
  document.getElementById('pb-r').style.width=(r/total*100)+'%';
}

function buildGrid(){
  document.getElementById('tours-grid').innerHTML=TOUR_IDS.map(tid=>`
    <div class="tc" id="tc-${tid}">
      <div class="tc-head">
        <span class="tc-id">${tid}</span>
        <span class="tc-status idle" id="tcs-${tid}">○ Non démarrée</span>
      </div>
      <div class="tc-body">
        <div class="tc-field">
          <span class="tc-label">👤</span>
          <input class="tc-input" id="tf-${tid}" placeholder="Facteur titulaire…" onchange="saveAssign('${tid}')" oninput="schedSave('${tid}')">
          <span class="saved" id="sv-${tid}">✓</span>
        </div>
        <div class="tc-field">
          <span class="tc-label">🔄</span>
          <input class="tc-input rempl" id="tr-${tid}" placeholder="Remplaçant…" onchange="saveAssign('${tid}')">
        </div>
        <div class="tc-times">
          <input class="tc-time" id="td-${tid}" type="time" placeholder="Début" onchange="saveAssign('${tid}')">
          <input class="tc-time" id="tf2-${tid}" type="time" placeholder="Fin" onchange="saveAssign('${tid}')">
        </div>
        <div class="tpbar">
          <div class="pseg" id="tp-g-${tid}" style="width:0%;background:var(--green)"></div>
          <div class="pseg" id="tp-r-${tid}" style="width:0%;background:var(--red)"></div>
        </div>
        <div class="tc-counts">
          <span>✅ <b id="tg-${tid}">0</b></span>
          <span style="color:var(--red)">🔒 <b id="ta-${tid}">0</b></span>
          <span style="color:var(--blue)">🚫 <b id="ts2-${tid}">0</b></span>
          <span style="margin-left:auto;font-weight:600" id="tp-${tid}">0%</span>
        </div>
      </div>
      <div class="tc-foot">
        <span class="tc-last" id="tl-${tid}">Pas encore commencée</span>
        <span class="tc-inc" id="ti-${tid}"></span>
      </div>
    </div>`).join('');
}

function updateCards(){
  TOUR_IDS.forEach(tid=>{
    const st=data.stats[tid]||{};
    const assign=data.assignments[tid]||{};
    const total=TOUR_META[tid]?.total||1;
    const g=st[2]||0,r=st[3]||0;
    const pct=Math.round(g/total*100);
    const acces=st.acces||0,sp=st.stoppub||0;

    document.getElementById('tp-g-'+tid).style.width=(g/total*100)+'%';
    document.getElementById('tp-r-'+tid).style.width=(r/total*100)+'%';
    document.getElementById('tg-'+tid).textContent=g;
    document.getElementById('ta-'+tid).textContent=acces;
    document.getElementById('ts2-'+tid).textContent=sp;
    document.getElementById('tp-'+tid).textContent=pct+'%';

    const sEl=document.getElementById('tcs-'+tid);
    if(pct===100){sEl.textContent='✅ Terminée';sEl.className='tc-status done';}
    else if(g>0){sEl.textContent='🔄 En cours — '+pct+'%';sEl.className='tc-status prog';}
    else if(r>0){sEl.textContent='⛔ Bloquée';sEl.className='tc-status bloc';}
    else{sEl.textContent='○ Non démarrée';sEl.className='tc-status idle';}

    const last=data.lastUpdate[tid];
    if(last) document.getElementById('tl-'+tid).textContent='Dernière action : '+new Date(last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

    const fEl=document.getElementById('tf-'+tid);
    const rEl=document.getElementById('tr-'+tid);
    const dEl=document.getElementById('td-'+tid);
    const f2El=document.getElementById('tf2-'+tid);
    if(fEl&&document.activeElement!==fEl) fEl.value=assign.facteur||'';
    if(rEl&&document.activeElement!==rEl) rEl.value=assign.remplacant||'';
    if(dEl&&document.activeElement!==dEl) dEl.value=assign.heure_debut||'';
    if(f2El&&document.activeElement!==f2El) f2El.value=assign.heure_fin||'';

    const incCount=data.incidents[tid]||0;
    const incEl=document.getElementById('ti-'+tid);
    if(incEl){incEl.style.display=incCount>0?'':'none';incEl.textContent='⚠️ '+incCount+' incident'+(incCount>1?'s':'');}
  });
}

function schedSave(tid){clearTimeout(saveTimers[tid]);saveTimers[tid]=setTimeout(()=>saveAssign(tid),1200);}

async function saveAssign(tid){
  const body={
    facteur:document.getElementById('tf-'+tid)?.value||'',
    remplacant:document.getElementById('tr-'+tid)?.value||'',
    heure_debut:document.getElementById('td-'+tid)?.value||'',
    heure_fin:document.getElementById('tf2-'+tid)?.value||''
  };
  try{
    await fetch('/api/assignments/'+tid,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const sv=document.getElementById('sv-'+tid);
    sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),1500);
  }catch(e){}
}

async function confirmReset(){
  if(!confirm('Archiver et réinitialiser TOUTES les tournées ?')) return;
  await fetch('/api/reset-all',{method:'POST'});
}
</script>
</body>
</html>
